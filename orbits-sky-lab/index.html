<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit's Sky Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#121A3E;--navy2:#0D1330;--cobalt:#2F4BDB;--cobalt2:#1F35A8;
  --gold:#E39A00;--gold2:#FFC23D;--mint:#12936F;--coral:#E06A00;--pink:#D93E75;--teal:#0E8FA8;--violet:#7A5AF0;
  --bg:#EAF0F8;--card:#fff;--ink:#1B2540;--muted:#56637F;--line:#D3DBE8;--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Nunito","Trebuchet MS",Verdana,system-ui,sans-serif;font-weight:800;color:var(--ink);background:var(--navy);font-size:20px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#shell{display:flex;min-height:100vh}
/* sidebar */
#side{width:104px;background:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;flex:none;position:sticky;top:0;height:100vh}
#side .logo{font-size:12px;color:var(--gold2);text-align:center;line-height:1.1;margin-bottom:10px;font-weight:900;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;gap:6px}#side .logo img{width:78px;height:78px;border-radius:20px;box-shadow:0 0 0 3px var(--gold)}
.nav{width:92px;padding:10px 4px;border-radius:18px;color:#9fb0e8;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.nav .i{font-size:30px;line-height:1}
.nav.on{background:rgba(255,255,255,.12);color:#fff}
.nav:focus-visible{outline:4px solid var(--gold2)}
/* main */
#main{flex:1;min-width:0;background:var(--bg);border-radius:34px 0 0 34px;overflow:hidden;display:flex;flex-direction:column}
#hd{background:linear-gradient(120deg,var(--gold) 0%,var(--gold2) 100%);padding:16px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.me{display:flex;align-items:center;gap:14px}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--navy);border:4px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.avatar img,.avatar svg{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.nameplate{background:var(--navy);color:#fff;border-radius:16px;padding:6px 16px}
.nameplate b{font-size:24px;display:block;line-height:1.1}.nameplate span{font-size:15px;color:var(--gold2)}
.xpbar{margin-top:6px;height:22px;border-radius:12px;background:#fff;position:relative;overflow:hidden;min-width:200px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cobalt),#6b86ff);border-radius:12px}
.xpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border-radius:999px;padding:8px 16px;font-size:18px;color:var(--navy);display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#screen{padding:18px 22px 40px;flex:1;min-width:0}
h1{font-size:30px;margin:6px 0 12px;color:var(--navy)}
h2{font-size:24px;margin:20px 0 10px;color:var(--navy)}
.tabs{display:flex;gap:26px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 4px;font-size:21px;color:#8a96b2;border-bottom:5px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--cobalt);border-bottom-color:var(--cobalt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:210px;gap:16px;overflow-x:auto;padding-bottom:10px}
.cardx{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(18,26,62,.12);text-align:left;display:flex;flex-direction:column;position:relative;width:100%}
.cardx:active{transform:translateY(2px)}
.thumb{height:104px;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
.tag{position:absolute;left:0;bottom:0;color:#fff;font-size:14px;padding:3px 12px;border-radius:0 12px 0 0}
.done-mark{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid #fff}
.cb{padding:10px 12px 12px}
.cb b{display:block;font-size:19px;line-height:1.2;min-height:46px}
.cb small{color:var(--muted);font-size:15px}
.spk{position:absolute;right:8px;bottom:8px;background:var(--navy);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}
.t-video{background:linear-gradient(135deg,#1F35A8,#2F4BDB)}.t-challenge{background:linear-gradient(135deg,#E06A00,#FFB347)}
.t-lesson{background:linear-gradient(135deg,#0D1330,#2a3a8f)}.t-fact{background:linear-gradient(135deg,#E39A00,#FFC23D)}
.t-trivia{background:linear-gradient(135deg,#0E8FA8,#3ed0c0)}.t-ask{background:linear-gradient(135deg,#7A5AF0,#a08bff)}
.tg-video{background:#C23B3B}.tg-challenge{background:var(--coral)}.tg-lesson{background:var(--navy)}.tg-fact{background:var(--gold);color:#2b2100}.tg-trivia{background:var(--teal)}.tg-ask{background:var(--violet)}
.cats{display:flex;gap:12px;flex-wrap:wrap}
.cat{border-radius:16px;padding:12px 18px;color:#fff;font-size:20px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn{background:var(--cobalt);color:#fff;border-radius:18px;padding:14px 22px;font-size:22px;box-shadow:0 5px 0 var(--cobalt2);display:inline-flex;align-items:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cobalt2)}
.btn.gold{background:var(--gold2);color:var(--navy);box-shadow:0 5px 0 var(--gold)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #0b6b52}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.5}
.btn:focus-visible,.cardx:focus-visible,.opt:focus-visible,.step:focus-visible,.tab:focus-visible,.cat:focus-visible{outline:5px solid var(--gold2);outline-offset:2px}
.panel{background:#fff;border-radius:var(--r);padding:20px 22px;box-shadow:0 4px 14px rgba(18,26,62,.1);margin-bottom:16px}
.bighead{background:linear-gradient(120deg,var(--cobalt2),var(--cobalt));color:#fff;border-radius:var(--r);padding:16px 22px;margin-bottom:16px}
.bighead h1{color:#fff;margin:0 0 8px}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:17px}
.fact{font-size:30px}
.mats{display:flex;gap:10px;flex-wrap:wrap}
.mat{background:#fff;border-radius:14px;padding:10px 14px;text-align:center;box-shadow:0 3px 10px rgba(18,26,62,.12);min-width:96px}.mat .e{font-size:34px;display:block}.mat span{font-size:15px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f1f4fb;border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:21px}
.step .n{font-size:26px;color:var(--cobalt);width:34px;flex:none;text-align:center}
.step .tx{flex:1}
.step.on{background:var(--mint);color:#fff}.step.on .n{color:#fff}
.mini{background:var(--navy);color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.opts{display:grid;gap:12px;margin-top:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:999px;padding:14px 22px;font-size:23px;text-align:left}
.opt.good{background:var(--mint);border-color:var(--mint);color:#fff}.opt.bad{background:#f6d4d9;border-color:#d96a7f}
textarea,input[type=text]{width:100%;font:inherit;font-size:22px;border-radius:999px;border:3px solid var(--line);padding:12px 20px;background:#fff;color:var(--ink)}
textarea{border-radius:22px;min-height:76px}
.msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.m{max-width:92%;padding:12px 16px;border-radius:20px;font-size:23px}
.m.me{align-self:flex-end;background:var(--cobalt);color:#fff;border-bottom-right-radius:6px}
.m.orb{align-self:flex-start;background:#fff;box-shadow:0 3px 10px rgba(18,26,62,.12);border-bottom-left-radius:6px}
.dots::after{content:"…";animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.hint{color:var(--muted);font-size:16px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:0 3px 10px rgba(18,26,62,.1)}.badge .e{font-size:44px;display:block}.badge.off{opacity:.35;filter:grayscale(1)}
.hidden{display:none!important}
/* orbit guide */
#body{display:flex;flex:1;min-width:0;align-items:flex-start}
#guide{cursor:pointer;width:260px;flex:none;position:sticky;top:12px;margin:16px 18px 0 0;background:#fff;border-radius:26px;box-shadow:0 6px 18px rgba(18,26,62,.15);padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
#orb{width:210px;height:250px;flex:none;opacity:1;animation:fl 3.2s ease-in-out infinite}
#orb img,#orb svg{width:100%;height:100%;object-fit:contain}
#orb .ow,#startOrb .ow{position:relative;width:100%;height:100%}
#orb .ow img,#startOrb .ow img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.owing{transform-origin:78.9% 47%}
.waving .owing{animation:wv 2.4s ease-in-out 1}
#startOrb .owing{animation:wv 2.4s ease-in-out infinite}
@keyframes wv{0%{transform:rotate(0)}15%{transform:rotate(-45deg)}28%{transform:rotate(-62deg)}41%{transform:rotate(-40deg)}54%{transform:rotate(-62deg)}67%{transform:rotate(-40deg)}80%{transform:rotate(-55deg)}100%{transform:rotate(0)}}
.talking .owing{animation:fl2 .5s ease-in-out infinite}@keyframes fl2{50%{transform:rotate(-8deg)}}
.cheering .owing{opacity:0}
@media (prefers-reduced-motion:reduce){.owing{animation:none!important}}

@keyframes fl{50%{transform:translateY(-7px)}}
#orb.talking{animation:fl .5s ease-in-out infinite}
#orb.talking .mouth{animation:tk .25s steps(2) infinite}@keyframes tk{50%{transform:scaleY(.3)}}.mouth{transform-origin:60px 78px}
#say{background:var(--bg);border-radius:20px;padding:12px 16px;font-size:20px;color:var(--navy);width:100%;text-align:center}
#vol{position:fixed;right:14px;top:12px;z-index:6}
#startov{position:fixed;inset:0;background:var(--navy);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:20px}
#startov h1{color:var(--gold2);font-size:40px;margin:0}
#startov .big{width:230px;height:270px;flex:none}
#startOrb img,#startOrb svg{width:100%;height:100%;object-fit:contain;display:block}
#startov{overflow:auto}
.t-design{background:linear-gradient(135deg,#7A5AF0,#B49BFF)}.tg-design{background:var(--violet)}
.dopt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 16px;font-size:20px;color:var(--navy);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.dopt.on{border-color:var(--cobalt);background:#E7EDFF;box-shadow:0 3px 0 var(--cobalt)}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 3px 0 rgba(0,0,0,.15)}
.swatch.on{box-shadow:0 0 0 4px var(--cobalt),0 3px 0 rgba(0,0,0,.15)}
.planeview svg{width:100%;max-width:560px;display:block;margin:0 auto;border-radius:16px}
@media print{body.printing #side,body.printing #hd,body.printing #guide,body.printing #startov{display:none!important}body.printing #screen>*:not(.printable){display:none!important}body.printing{background:#fff}}
.gp.sel>circle:first-child{stroke:#FFC23D;stroke-width:6}
.gp{cursor:pointer}.gp.hl>circle:first-child{stroke:#3DDC97;stroke-width:6;animation:hlp 1s ease-in-out infinite}
@keyframes hlp{50%{stroke:#fff}}
.holdb.on{background:#E7EDFF;box-shadow:0 5px 0 var(--cobalt)}
.gamecard{background:linear-gradient(#1B2A66,#0D1330);border:4px solid #FFC23D;border-radius:26px;padding:10px;margin-bottom:16px;box-shadow:0 6px 0 #B97800,0 10px 24px rgba(18,26,62,.35)}
.gamecard .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 18px;margin-top:10px;padding:0 6px}
.stat{display:flex;align-items:center;gap:8px;color:#fff;font-size:18px}.stat .si{width:26px;text-align:center}.stat .sl{width:62px}
.stat .sb{flex:1;height:14px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;display:block}
.stat .sb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3DDC97,#FFC23D)}
.stat .sv{width:70px;text-align:right;color:#FFC23D}
@media(max-width:700px){
  body{font-size:18px}
  #shell{flex-direction:column-reverse}
  #side{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;padding:6px;z-index:8;border-top:2px solid rgba(255,255,255,.12)}
  #side .logo{display:none}.nav{width:auto;flex:1;padding:6px 2px;font-size:12px}.nav .i{font-size:24px}
  #main{border-radius:0}
  #body{flex-direction:column}
  #guide{position:fixed;left:0;right:0;bottom:62px;width:auto;margin:0;border-radius:20px 20px 0 0;flex-direction:row;align-items:center;padding:8px 12px;gap:10px;z-index:7;background:#fff}
  #orb{width:64px;height:76px}#say{font-size:16px;padding:8px 12px;text-align:left}
  #screen{padding:14px 12px 170px;width:100%}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}.cb b{font-size:17px}.thumb{height:84px;font-size:44px}
  .avatar{width:58px;height:58px}.nameplate b{font-size:20px}.xpbar{min-width:150px}
}
</style>
</head>

<script>
/* ================= CONTENT (edit me) ================= */
const FACTS=[
 "Mach 1 is the speed of sound. Near the ground on a mild day, it is about 761 miles per hour. Way up high where the air is very cold, it is only about 660. Temperature changes it.",
 "Sound travels faster in warm air than in cold air. That is why Mach 1 is not one fixed number. Air temperature sets it, not how sticky the air is.",
 "Viscosity means how sticky a fluid is. It changes the drag on a wing, but it does not set the speed of sound.",
"Wings make planes fly by pushing air down. When the wing pushes the air down, the air pushes the wing up. That push is called lift.",
"The Wright brothers flew the first airplane on December 17, 1903. Their first flight lasted just 12 seconds.",
"A big jumbo jet can weigh as much as 60 elephants. It still flies, because its wings make enough lift.",
"A jet engine does four jobs. It sucks air in. It squeezes the air. It adds fuel and goes bang. Then it blows hot air out the back.",
"The black box on an airplane is really bright orange. That makes it easy to find after an accident.",
"A helicopter has wings too. They spin around really fast, so they are called rotor blades.",
"In 1947, pilot Chuck Yeager flew faster than sound. His rocket plane was called the Bell X-1.",
"On the Moon in 1971, astronaut Dave Scott dropped a hammer and a feather. With no air, they landed at the same time!",
"Astronauts float on the space station because they are falling around Earth. Gravity is not gone. It is still almost as strong as it is on the ground.",
"A small gear turning a big gear gives more turning power. But the big gear spins slower. Bikes use this trick.",
"A lever lets a small push move something heavy. A seesaw, a wheelbarrow, and a bottle opener are all levers.",
"The triangle is a super strong shape. That is why you see triangles in bridges, cranes, and airplane wings.",
"Friction is the rubbing force between two things. Rub your hands together fast and feel the heat it makes!",
"Engineers test new airplane shapes in a wind tunnel. A giant fan blows air over a small model of the plane.",
"The white lines behind a jet are called contrails. They are made of tiny ice crystals from the hot engine air.",
"The Concorde jet flew at twice the speed of sound. It could cross the Atlantic Ocean in about three and a half hours.",
"A hot air balloon floats because hot air is lighter than the cold air around it.",
"The skyscraper Taipei 101 has a giant steel ball that hangs inside. It swings the other way to keep the building steady in wind.",
"The longest paper airplane flight on record is over 226 feet. It was thrown in 2012 by Joe Ayoob.",
"An engineer is someone who solves problems by building things. Planes, phones, and bridges all started as ideas."

const TOPICS=[
{id:"planes",icon:"✈️",name:"Planes & Flight",cards:[
 {t:"Four forces",x:"Four forces act on a plane. Lift pushes it up. Weight pulls it down. Thrust pushes it forward. Drag slows it down. To fly level, lift must equal weight.",ask:"What are the four forces of flight?"},
 {t:"Why wings work",x:"A wing is curved on top and tilted a little. It sends air downward. The air pushes back up on the wing. That lifts the plane.",ask:"Why do airplane wings make lift?"},

{id:"physics",icon:"🧲",name:"Physics Power",cards:[

{id:"space",icon:"🚀",name:"Rockets & Space",cards:[

const ROBOT={mix:0.4,freq:60,speed:1.1};
function talking(b){$("#orb").classList.toggle("talking",b)}
function stopVoice(){try{V.tts&&V.tts.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}if(V.audio){try{V.audio.pause()}catch(e){}V.audio=null}talking(false)}
async function clip(id){if(!id)return null;try{const r=await fetch("audio/"+id+".mp3",{method:"HEAD"});if(r.ok)return "audio/"+id+".mp3"}catch(e){}return null}
async function playClip(url){
  const a=new Audio(url);V.audio=a;a.preservesPitch=true;a.playbackRate=ROBOT.speed;let osc=null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;V.ctx=V.ctx||new AC();const ctx=V.ctx;
    if(ctx.state==="suspended")await ctx.resume();
    const src=ctx.createMediaElementSource(a);
    const dry=ctx.createGain();dry.gain.value=1-ROBOT.mix;const wet=ctx.createGain();wet.gain.value=ROBOT.mix;
    const ring=ctx.createGain();ring.gain.value=0;osc=ctx.createOscillator();osc.type="sine";osc.frequency.value=ROBOT.freq;osc.connect(ring.gain);osc.start();
    const dl=ctx.createDelay(.05);dl.delayTime.value=.011;const fb=ctx.createGain();fb.gain.value=.35;
    src.connect(dry);dry.connect(ctx.destination);src.connect(ring);ring.connect(dl);dl.connect(fb);fb.connect(dl);ring.connect(wet);dl.connect(wet);wet.connect(ctx.destination);
  }catch(e){}
  await new Promise((res,rej)=>{a.onended=res;a.onerror=rej;a.play().catch(rej)});
  try{osc&&osc.stop()}catch(e){}
}
async function say(text,id){
  if(text)V.last={text,id};
  stopVoice();if(!V.on||!text)return;talking(true);
  try{
    const url=await clip(id);
    if(url){await playClip(url);talking(false);return}
    if(V.tts){await V.tts.speak(text.slice(0,1900),{rate:.95,language:"en"});talking(false);return}
    if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.onend=()=>talking(false);u.onerror=()=>talking(false);speechSynthesis.speak(u);return}
  }catch(e){}
  talking(false);
}
function orbitSays(t,id){$("#say").textContent=t;say(t,id)}

const SIM={rho:1.225,mph:0.44704,W0:8000,S0:10,runway:300};
const WSHAPE={flat:{n:"Flat wing",cam:0,stall:13,ic:"▬"},curved:{n:"Curved wing",cam:0.4,stall:16,ic:"🌙"}};
const WSIZE=[["Small",0.6],["Medium",1],["Large",1.4]];
function liftCoef(a,cam,stallA){
  let cl=cam+0.105*a,stalled=false;
  if(a>stallA){stalled=true;const cmax=cam+0.105*stallA;cl=Math.max(cmax*0.45,cmax*(1-0.07*(a-stallA)))}
  return {cl,stalled};
}
function dragCoef(cl,cd0,stalled,a,stallA){return cd0+0.045*cl*cl+(stalled?0.035*(a-stallA):0)}
function aero(vMph,a,cam,stallA,S,cd0){
  const v=vMph*SIM.mph,q=0.5*SIM.rho*v*v,{cl,stalled}=liftCoef(a,cam,stallA);
  return {lift:q*S*cl,drag:q*S*dragCoef(cl,cd0,stalled,a,stallA),cl,stalled};
}

  /* animation */
  const ctx=cv.getContext&&cv.getContext("2d");if(!ctx)return;
  const P=[...Array(110)].map((_,i)=>({x:Math.random()*640,l:-135+270*((i*0.618)%1)}));

    for(let i=24;i>=0;i--){const u=i/24,x=-c/2+c*u,b=4*u*(1-u);ctx.lineTo(x,-(cam*b)+th*0.35*Math.sqrt(b))}
    ctx.closePath();ctx.fillStyle="#E39A00";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#FFC23D";ctx.stroke();
    ctx.restore();

    ctx.fillStyle="#56637F";ctx.fillRect(cx-4,cy+8,8,150);

      const a=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-16*Math.cos(a-.5),y+dy-16*Math.sin(a-.5));ctx.lineTo(x+dx-16*Math.cos(a+.5),y+dy-16*Math.sin(a+.5));ctx.closePath();ctx.fill();
      ctx.font="800 18px Nunito,Arial";ctx.fillText(label,x+(dx>0?dx+8:dx<0?dx-70:10),y+dy+(dy>0?20:dy<0?-8:6))};
    if(Lh>4)arrow(cx+70,cy-30,0,-Lh,res.lift>=W&&!stall?"#3DDC97":"#FFC23D","Lift");

/* ---------- Speed of sound / Mach lab ---------- */

const BODYS={airliner:{w:900,cd:0.035,n:"Airliner"},jet:{w:700,cd:0.025,n:"Jet"},prop:{w:600,cd:0.03,n:"Prop plane"},rocket:{w:650,cd:0.02,n:"Rocket plane"}};

}

  const specTxt=()=>{const b=BODYS[p.body],w=WNG[p.wings],e=ENG[p.engines];$("#spec").textContent=`${b.n} with ${w.n} wings and ${e.n}.`;$("#bn").textContent="📦 × "+boxes};
  specTxt();

  $("#bp").onclick=()=>{if(!running){boxes=Math.min(6,boxes+1);specTxt();reset()}};
  const ctx=cv.getContext&&cv.getContext("2d");
  let s=null;
  function fresh(){s={x:0,v:0,alt:0,up:false,done:false,t:0,vTo:0,dTo:0,spec:planeSpecs(p,boxes),shown:false}}
  function reset(){running=false;fresh();$("#tRes").textContent="";$("#tS").textContent="0 mph";$("#tD").textContent="0 m";$("#tL").textContent="0%";if(ctx)drawScene()}
  fresh();
  go2.onclick=()=>{if(running)return;reset();running=true;say("Engines on!","sim-go")};
  rs.onclick=reset;
  const X0=40,X1=600,sc=(X1-X0)/SIM.runway;
  function sprite(x,y,pitch){
    const body=p.cBody,wing=p.cWing,tail=p.cTail;
    ctx.save();ctx.translate(x,y);ctx.rotate(-pitch);
    ctx.fillStyle="#121A3E";ctx.beginPath();ctx.arc(-14,12,6,0,7);ctx.arc(16,12,6,0,7);ctx.fill();
    ctx.fillStyle=tail;ctx.strokeStyle="#121A3E";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-40,-2);ctx.lineTo(-52,-26);ctx.lineTo(-30,-26);ctx.lineTo(-18,-2);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,46,13,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=wing;ctx.beginPath();
    if(p.wings==="swept"){ctx.moveTo(-6,2);ctx.lineTo(22,2);ctx.lineTo(-14,-22);ctx.lineTo(-30,-22)}

    else{ctx.moveTo(-8,2);ctx.lineTo(18,2);ctx.lineTo(14,-22);ctx.lineTo(-8,-22)}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#7FE6F0";ctx.beginPath();ctx.ellipse(28,-3,9,5,0,0,7);ctx.fill();ctx.stroke();
    if(p.engines==="jets"){ctx.fillStyle="#C9D1E3";ctx.beginPath();ctx.roundRect?ctx.roundRect(-4,6,26,9,4):ctx.rect(-4,6,26,9);ctx.fill();ctx.stroke()}
    if(p.engines==="prop"){ctx.fillStyle="#121A3E";ctx.fillRect(44,-20,5,40)}
    for(let i=0;i<boxes;i++){ctx.fillStyle="#C99A5B";ctx.strokeStyle="#6b4a1d";ctx.lineWidth=2;ctx.fillRect(-40+i*13,-30-(i>3?12:0),12,12);ctx.strokeRect(-40+i*13,-30-(i>3?12:0),12,12)}
    ctx.restore();
  }
  function drawScene(){
    ctx.clearRect(0,0,640,300);
    ctx.fillStyle="#8FD0FF";ctx.fillRect(0,0,640,300);
    ctx.fillStyle="rgba(255,255,255,.85)";[[90,50,38],[330,36,30],[520,70,36]].forEach(([x,y,r])=>{ctx.beginPath();ctx.ellipse(x,y,r,r*.4,0,0,7);ctx.fill()});
    ctx.fillStyle="#5a9b4a";ctx.fillRect(0,236,640,64);
    ctx.fillStyle="#4A4F5C";ctx.fillRect(X0-10,236,X1-X0+30,18);
    ctx.fillStyle="#fff";for(let m=0;m<=SIM.runway;m+=50){const x=X0+m*sc;ctx.fillRect(x-1,238,3,14);ctx.font="800 13px Nunito,Arial";ctx.fillText(m+"m",x-10,272)}
    ctx.fillStyle="#E06A00";for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(X1+14+i*10,236);ctx.lineTo(X1+8+i*10,236);ctx.lineTo(X1+11+i*10,218);ctx.closePath();ctx.fill()}
    ctx.fillStyle="#C23B3B";ctx.font="900 14px Nunito,Arial";ctx.fillText("END",X1-6,208);
    const px=X0+s.x*sc,py=236-14-s.alt*2.2;
    sprite(px,py,s.up?0.14:Math.min(0.14,s.v/Math.max(1,s.vTo||30)*0.1));
  }
  function stepSim(dt){
    const sp=s.spec,v=s.v,q=0.5*SIM.rho*v*v,{cl,stalled}=liftCoef(8,sp.cam,sp.stall);
    const rot=s.up?1:(v>0?1:0);const lift=q*sp.S*cl,drag=q*sp.S*dragCoef(cl,sp.cd0,stalled,8,sp.stall);
    const m=sp.W/9.8,fr=s.up?0:0.03*Math.max(0,sp.W-lift);
    const a=(sp.T-drag-fr)/m;s.v=Math.max(0,s.v+a*dt);s.x+=s.v*dt;s.t+=dt;
    if(!s.up&&lift>=sp.W){s.up=true;s.vTo=s.v;s.dTo=s.x}
    if(s.up)s.alt+=Math.min(14,Math.max(4,(lift-sp.W)/sp.W*60+6))*dt;
    s.ratio=lift/sp.W;
    if(s.up&&s.alt>=45){s.done=true;s.ok=true}
    if(!s.up&&s.x>=SIM.runway){s.done=true;s.ok=false}
  }
  let tl=performance.now();
  function loop(now){
    if(!cv.isConnected)return;
    const dt=Math.min(0.05,(now-tl)/1000);tl=now;
    if(running&&!s.done){for(let i=0;i<3;i++)stepSim(dt*1.2);
      $("#tS").textContent=Math.round(s.v/SIM.mph)+" mph";$("#tD").textContent=Math.round(s.x)+" m";$("#tL").textContent=Math.round(Math.min(999,s.ratio*100))+"%";

      if(s.done){running=false;finish()}}

    raf=requestAnimationFrame(loop);
  }
  function finish(){
    const r=$("#tRes");let msg;
    if(s.ok){msg=`🎉 Takeoff! It lifted off after ${Math.round(s.dTo)} meters at ${Math.round(s.vTo/SIM.mph)} miles per hour.`;r.style.color="#0b6b52";

    r.textContent=msg;
    say(msg.replace(/[🎉💥]/gu,"").trim(),"sim-res-"+(s.ok?"ok":"no"));
  }
  if(ctx){drawScene();raf=requestAnimationFrame(loop)}
}

function newFlight(){return {pitch:0,roll:0,hdg:360,ias:0,alt:0,vs:0,thr:0,mix:1,flaps:0,trim:0,ground:true,fuel:40,pi:0,ri:0,ru:0,stalled:false,over:false,touch:null,crashed:false,turn:0,ball:0,rpm:0,oil:0,t:0,lesson:0,lvl:0,lvlT:0,msgT:0}}
function stepFlight(F,dt,assist){
  const fd=F.flaps;F.t+=dt;
  const run=F.fuel>0&&F.mix>0.12;const pow=run?F.thr*(0.7+0.3*Math.min(1,F.mix/0.8)):0;
  F.fuel=Math.max(0,F.fuel-0.022*F.thr*(0.5+0.5*F.mix)*dt);
  const rpmT=run?800+pow*1800:0;F.rpm+=(rpmT-F.rpm)*Math.min(1,3*dt);F.oil=F.rpm>200?35+F.rpm/2600*45:0;
  if(F.crashed)return;

    const tgt=pow*80;if(F.ias<tgt)F.ias=Math.min(tgt,F.ias+(7*pow+0.3)*dt);else F.ias=Math.max(tgt,F.ias-5*dt);

    F.roll=0;F.hdg=(F.hdg+(F.ias>3?F.ru*6*dt:0)+720)%360;F.vs=0;F.alt=0;F.turn=0;F.ball=0;
    const rotV=fd>=1?50:55;
    if(F.ias>=rotV-4&&F.pitch>=5){F.ground=false;F.vs=200}
    return;
  }
  const peq=2+F.trim*3;

  F.roll+=F.ri*35*dt;if(assist&&F.ri===0)F.roll-=Math.sign(F.roll)*Math.min(Math.abs(F.roll),10*dt);F.roll=Math.max(-60,Math.min(60,F.roll));

  const Vt=62+pow*48-2.4*F.pitch-5*fd;F.ias+=(Vt-F.ias)*0.18*dt;F.ias=Math.max(0,F.ias);F.over=F.ias>135;
  const aoa=Math.max(0,Math.min(14,2+(100-F.ias)*0.12-1.2*fd)),bankLoss=(1/Math.cos(F.roll*Math.PI/180)-1)*3;
  let gam=F.pitch-aoa-bankLoss;const vsT=F.ias*101.27*Math.sin(gam*Math.PI/180)-(F.stalled?500:0);
  F.vs+=(vsT-F.vs)*Math.min(1,0.9*dt);F.alt+=F.vs/60*dt;
  const rate=(9.81*Math.tan(F.roll*Math.PI/180)/Math.max(30,F.ias*0.5144))*180/Math.PI;
  F.turn=rate;F.hdg=((F.hdg+rate*dt+F.ru*1.5*dt)%360+360)%360;
  F.ball=Math.max(-1,Math.min(1,F.roll/30*0.9-F.ru*0.9));
  if(F.alt<=0){
    const v=F.vs;F.alt=0;F.ground=true;const bad=Math.abs(F.roll)>12;

    if(kind==="hard"){F.ground=false;F.alt=15;F.vs=250}
    F.roll=0;F.pitch=Math.min(F.pitch,6);
  }
}

    if(/INPUT|TEXTAREA/.test((e.target.tagName||"")))return;const m=keys[e.key]||keys[(e.key||"").toLowerCase()];if(m){e.preventDefault();F[m[0]]=m[1];const b=hb[m[0]+m[1]];if(b)b.classList.add("on")}};
  const ku=e=>{const m=keys[e.key]||keys[(e.key||"").toLowerCase()];if(m){F[m[0]]=0;const b=hb[m[0]+m[1]];if(b)b.classList.remove("on")}};
  window.addEventListener("keydown",kd);window.addEventListener("keyup",ku);
  /* lessons */
  let spoke=-1,hintT=0;
  const showLesson=()=>{const ls=LESSONS[Math.min(F.lesson,LESSONS.length-1)];
    if(F.lesson>=LESSONS.length){$("#lN").textContent="🏆 All lessons done";$("#lT").textContent="You are a pilot!";$("#lS").textContent="Keep flying and try your own flight. Tap any gauge to hear it again.";root.querySelectorAll(".gp").forEach(g=>g.classList.remove("hl"));return}
    $("#lN").textContent=`Lesson ${F.lesson+1} of ${LESSONS.length}`;$("#lT").textContent=ls.t;$("#lS").textContent=ls.say.replace(/^Lesson \w+\. /,"");
    root.querySelectorAll(".gp").forEach(gp=>gp.classList.toggle("hl",ls.watch.includes(gp.dataset.part)));
    if(spoke!==F.lesson){spoke=F.lesson;say(ls.say,"ck-"+ls.id)}};
  lh.onclick=()=>{const ls=LESSONS[Math.min(F.lesson,LESSONS.length-1)];say(ls.say,"ck-"+ls.id)};
  showLesson();
  const hint=(txt,id)=>{if(F.t-hintT<7)return;hintT=F.t;orbitSays(txt,id)};
  const ctx=cv.getContext&&cv.getContext("2d");
  let tl=performance.now(),acc=0,done=false;
  function loop(now){
    if(!cv.isConnected)return;
    const dt=Math.min(0.05,(now-tl)/1000);tl=now;
    for(let i=0;i<2;i++)stepFlight(F,dt*1.25,assist);
    updatePanel(root,F);if(ctx)drawView(ctx,F);
    /* lesson logic */
    if(!F.ground&&F.alt>=1200&&Math.abs(F.vs)<150)F.lvlT+=dt;else F.lvlT=0;F.lvl=F.lvlT;
    if(F.lesson<LESSONS.length){const ls=LESSONS[F.lesson];
      if(ls.ok(F)){if(addXP(ls.xp,"ck-"+ls.id)){}F.lesson++;orbitSays("Lesson done! "+(F.lesson<LESSONS.length?"Next one!":"You did them all!"));if(F.lesson>=LESSONS.length&&addXP(30,"ck-done"))say("You finished every lesson. You are a pilot! 30 bonus XP.","ck-pilot");setTimeout(()=>{if(cv.isConnected)showLesson()},2200)}}
    if(F.touch&&!F.touch.said){F.touch.said=1;const k=F.touch.kind;const m=k==="smooth"?"Smooth landing! Great job.":k==="firm"?"A firm landing. Try to sink slower next time.":k==="hard"?"Bounce! That was a hard landing. Add power and try again.":"Crash! You came down too fast. Press Restart flight to try again.";orbitSays(m,"ck-land-"+k)}
    if(F.stalled)hint("Stall warning! Push the nose down and add power.","ck-h-stall");
    else if(F.over)hint("Too fast! Pull the throttle back.","ck-h-over");
    else if(!F.ground&&F.alt<400&&F.vs<-900)hint("Sinking too fast! Pull back a little.","ck-h-sink");
    else if(F.fuel<=0&&F.t>2)hint("Out of fuel! Glide down and land.","ck-h-fuel");
    raf=requestAnimationFrame(loop);
  }
  let raf=requestAnimationFrame(loop);
}

   {tag:"Fact",type:"fact",icon:"💡",title:"Fact of the Day",sub:"+10 XP",id:"fact-"+todayStr(),go:()=>go("fact"),speak:"Fact of the Day"},
   {tag:"Challenge",type:"challenge",icon:ch.icon,title:ch.title,sub:`+${ch.xp} XP · ${ch.min} min`,id:ch.id,go:()=>go("challenge",ch.id),speak:ch.title+". A hands on challenge."},

}

let tq=null;
function trivia(){
  if(!tq||tq.i>=tq.q.length)tq={q:[...TRIVIA].sort(()=>Math.random()-.5).slice(0,5),i:0,score:0};
  const t=tq,item=t.q[t.i];
  speak(item.q,item.q+" "+item.o.map((x,k)=>"Choice "+(k+1)+": "+x).join(". "));
  const p=el(`<div class="panel"><h1>🧠 Trivia · Question ${t.i+1} of 5</h1><p class="fact"></p></div>`);p.querySelector("p").textContent=item.q;
  const o=el(`<div class="opts"></div>`);
  item.o.forEach((txt,k)=>{
    const b=el(`<button class="opt"></button>`);b.textContent=(k+1)+".  "+txt;
    b.onclick=()=>{
      if(o.dataset.done)return;
      if(k===item.a){o.dataset.done=1;b.classList.add("good");t.score++;S.xp+=10;save();hud();cheer();orbitSays("Yes! "+txt+" is right. Plus 10 XP.");next()}
      else{b.classList.add("bad");b.disabled=true;orbitSays("Not quite. Try another one!")}
    };
    o.append(b);
  });
  p.append(o);screen.append(p);
  function next(){
    const last=t.i+1>=t.q.length;
    const nb=el(`<button class="btn gold" style="margin-top:14px">${last?"🏁 See my score":"➡️ Next question"}</button>`);
    nb.onclick=()=>{t.i++;if(last){finish()}else go("trivia")};p.append(nb);
  }
  function finish(){
    if(t.score>S.best){S.best=t.score;save()}
    screen.innerHTML="";
    orbitSays("You got "+t.score+" out of 5! "+(t.score>=4?"Awesome work, engineer!":"Nice try. Let's go again!"));
    screen.append(el(`<div class="panel"><h1>🏁 Score: ${t.score} / 5</h1><p class="fact">${t.score>=4?"Amazing! 🌟":"Good try! Learn more and play again. 🚀"}</p></div>`));
    const a=el(`<button class="btn mint">🔁 Play again</button>`);a.onclick=()=>{tq=null;go("trivia")};
    const h=el(`<button class="btn ghost">🏠 Home</button>`);h.onclick=()=>go("home");
    screen.append(a,el(`<span> </span>`),h);
    addXP(0,"trivia-"+todayStr());tq=null;
  }
}

    }catch(e){ob.textContent=(e&&e.code==="rate_limited")?"Whoa, too many questions at once. Wait a moment and try again.":"I could not answer that right now. Try again in a moment."}
  }
}
